version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: pncp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pncp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - pncp-network

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: pncp-backend
    env_file:
      - ../../backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pncp
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - pncp-network

networks:
  pncp-network:
    driver: bridge

volumes:
  postgres_data:
